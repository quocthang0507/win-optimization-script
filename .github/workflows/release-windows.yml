name: Release Windows App

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Semantic version to release, without the v prefix"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release-windows:
    name: Build and publish Windows release
    runs-on: windows-latest

    env:
      PROJECT_PATH: src/app/WinOptimizationApp.csproj
      TEST_PROJECT_PATH: src/tests/WinOptimizationApp.Tests/WinOptimizationApp.Tests.csproj
      PUBLISH_DIR: artifacts/publish/win-x64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Resolve release version
        id: version
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $version = "${{ inputs.version }}"
          } else {
            $version = "${{ github.ref_name }}".TrimStart("v")
          }

          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "Version must use semantic format X.Y.Z. Actual: $version"
          }

          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "tag=v$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Restore
        run: dotnet restore $env:TEST_PROJECT_PATH

      - name: Test
        run: dotnet test $env:TEST_PROJECT_PATH --configuration Release --no-restore

      - name: Publish
        run: >
          dotnet publish $env:PROJECT_PATH
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:Version=${{ steps.version.outputs.version }}
          -p:AssemblyVersion=${{ steps.version.outputs.version }}.0
          -p:FileVersion=${{ steps.version.outputs.version }}.0
          -p:InformationalVersion=${{ steps.version.outputs.version }}
          -p:PublishDir=${{ github.workspace }}\${{ env.PUBLISH_DIR }}\

      - name: Package
        id: package
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $zip = "WinOptimizationApp-v$version-win-x64.zip"
          Compress-Archive -Path "${{ env.PUBLISH_DIR }}\*" -DestinationPath $zip -Force
          Get-FileHash $zip -Algorithm SHA256 | ForEach-Object {
            "{0}  {1}" -f $_.Hash, $zip
          } | Set-Content "$zip.sha256"
          "zip=$zip" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ steps.version.outputs.tag }}"
          $zip = "${{ steps.package.outputs.zip }}"
          $notes = @"
          Windows x64 self-contained release.

          Files:
          - $zip
          - $zip.sha256

          Install:
          1. Download and extract the ZIP.
          2. Close any running copy of the app.
          3. Replace the previous app folder with the extracted files.
          "@

          gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $zip "$zip.sha256" --clobber
          } else {
            gh release create $tag $zip "$zip.sha256" --title "WinOptimizationApp $tag" --notes $notes
          }
